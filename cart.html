<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cart | Okrika Bales Depot</title>
  <meta name="description" content="Your cart.">
  <meta name="theme-color" content="#141414">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen">
  <script>
    // Collect load errors so a help box can say exactly what failed
    window.__errs = [];
    addEventListener("error", function (e) {
      var t = e.target;
      window.__errs.push(t && (t.src || t.href) ? "Couldn't load " + (t.src || t.href) : (e.message || "Script error"));
    }, true);
  </script>
  <div id="site-header"></div>
  <main>
    <div class="mx-auto max-w-7xl px-4 pt-6 sm:px-6">
      <p class="text-sm text-ink/50"><a href="index.html" class="hover:text-ink">Home</a> <span class="mx-1">/</span> <span class="text-ink">Cart</span></p>
      <div class="mt-4 border-b border-strap pb-6"><h1 class="section-title !text-3xl sm:!text-4xl">Your cart</h1><p class="mt-2 text-ink/55">Review your bales before checkout.</p></div>
    </div>
    <div id="cart" class="mx-auto max-w-5xl px-4 py-10"><p class="text-ink/60">Loading your cart…</p></div>
    <div class="h-16"></div>
  </main>
  <div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/convex@1.46.0/dist/browser.bundle.js"></script>
  <script type="module" src="js/pages/cart.js"></script>
  <script>
    // If the page's code can't run, show what's wrong instead of a blank "Loading…" page
    (function () {
      function help(title, lines) {
        var box = document.createElement("div");
        box.setAttribute("style", "position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(15,27,45,.85);font-family:system-ui,sans-serif");
        box.innerHTML = '<div style="max-width:560px;width:100%;background:#fff;border-radius:14px;padding:24px;color:#0f1b2d;line-height:1.5">' +
          '<p style="margin:0 0 4px;color:#f26b1d;font-weight:800">Site not running correctly</p>' +
          '<h2 style="margin:0 0 12px;font-size:20px">' + title + '</h2><ol style="margin:0;padding-left:20px">' +
          lines.map(function (l) { return '<li style="margin:6px 0">' + l + '</li>'; }).join("") + '</ol>' +
          (window.__errs && window.__errs.length ? '<p style="margin:14px 0 4px;font-weight:700">Details</p><pre style="white-space:pre-wrap;background:#f5f5f2;padding:10px;border-radius:8px;font-size:12px;margin:0">' +
            window.__errs.slice(0, 6).join("\n").replace(/</g, "&lt;") + '</pre>' : "") + '</div>';
        document.body.appendChild(box);
      }
      if (location.protocol === "file:") {
        return help("You opened the file directly", [
          "Browsers block the site's code when a page is opened by double-clicking it.",
          "Open a terminal <b>inside the bale-store-html folder</b> and run <code>npx serve .</code>",
          "Then open <b>http://localhost:3000</b> (admin: <b>http://localhost:3000/admin/</b>).",
          "Or in VS Code: open the bale-store-html folder and click <b>Go Live</b>."
        ]);
      }
      setTimeout(function () {
        if (window.__appReady) return;
        help("The page's code didn't load", [
          "Check you're connected to the internet (Convex and the charts load from the internet).",
          "Make sure the server was started <b>inside the bale-store-html folder</b> (the one with index.html, css and js in it).",
          "Stop the server (Ctrl + C), run <code>npx serve .</code> again, then hard-refresh the page (Ctrl + Shift + R).",
          "If it still shows this, send a screenshot of this box."
        ]);
      }, 7000);
    })();
  </script>
</body>
</html>
